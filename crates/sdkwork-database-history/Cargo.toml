[package]
name = "sdkwork-database-history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SDKWork database ops history tables and queries"

[features]
default = ["postgres"]
postgres = ["sqlx/postgres", "sdkwork-database-sqlx/postgres"]
sqlite = ["sqlx/sqlite", "sdkwork-database-sqlx/sqlite"]

[dependencies]
sdkwork-database-config = { path = "../sdkwork-database-config" }
sdkwork-database-sqlx = { path = "../sdkwork-database-sqlx", default-features = false }

hex = "0.4"
sha2 = "0.10"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
