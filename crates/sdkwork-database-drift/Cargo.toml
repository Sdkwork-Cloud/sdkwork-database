[package]
name = "sdkwork-database-drift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SDKWork database schema drift detection"

[features]
default = ["postgres"]
postgres = [
    "sqlx/postgres",
    "sdkwork-database-sqlx/postgres",
    "sdkwork-database-history/postgres",
    "sdkwork-database-lifecycle/postgres",
]
sqlite = [
    "postgres",
    "sqlx/sqlite",
    "sdkwork-database-sqlx/sqlite",
    "sdkwork-database-history/sqlite",
    "sdkwork-database-lifecycle/sqlite",
]

[dependencies]
sdkwork-database-config = { path = "../sdkwork-database-config" }
sdkwork-database-contract = { path = "../sdkwork-database-contract" }
sdkwork-database-history = { path = "../sdkwork-database-history", default-features = false }
sdkwork-database-sqlx = { path = "../sdkwork-database-sqlx", default-features = false }
sdkwork-database-spi = { path = "../sdkwork-database-spi" }

async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url.workspace = true
sdkwork-database-config = { path = "../sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database-lifecycle", default-features = false }
sdkwork-database-sqlx = { path = "../sdkwork-database-sqlx", default-features = false }
sdkwork-database-spi = { path = "../sdkwork-database-spi" }

[[test]]
name = "constraint_drift"
# SQLite-backed drift detection; skipped unless the sqlite feature is enabled.
required-features = ["sqlite"]

[[test]]
name = "drift_smoke"
# SQLite-backed drift smoke test; skipped unless the sqlite feature is enabled.
required-features = ["sqlite"]

[[test]]
name = "nullability_drift"
# SQLite-backed nullability drift detection; skipped unless sqlite is enabled.
required-features = ["sqlite"]

[[test]]
name = "sqlite_metadata_drift"
# SQLite metadata drift detection; skipped unless sqlite is enabled.
required-features = ["sqlite"]
